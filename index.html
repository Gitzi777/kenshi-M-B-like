<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Terres Arides</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="view"></div>

  <!-- Création du personnage -->
  <div id="creation" class="panel">
    <h2>Créer ton personnage</h2>
    <label>Nom <input id="cName" maxlength="16" value="Vagabond"></label>

    <div class="label">Origine</div>
    <div id="cOrigins" class="choices"></div>

    <div class="label">Tenue</div>
    <div id="cBody" class="swatches"></div>
    <div class="label">Peau</div>
    <div id="cSkin" class="swatches"></div>
    <div class="label">Taille</div>
    <input id="cHeight" type="range" min="0.9" max="1.1" step="0.01" value="1">

    <div class="label">Caractéristiques <span id="cPoints"></span></div>
    <div id="cStats"></div>

    <button id="cStart" class="big">Commencer</button>
  </div>

  <!-- Interface en jeu -->
  <div id="hud" class="hidden">
    <div id="topbar">
      <span>💰 <b id="money">0</b></span>
      <span>🍖 <b id="food">0</b></span>
      <span>📦 <b id="cargo">0/0</b></span>
      <span>☀️ Jour <b id="day">1</b></span>
      <span id="orderLabel"></span>
    </div>
    <div id="player" class="panel">
      <b id="pName"></b> <small id="pLevel"></small>
      <div class="bar big"><div id="pHp"></div></div>
      <small id="pHpText"></small>
      <div id="squadList"></div>
    </div>
    <div id="prompt" class="hidden"></div>
    <div id="log"></div>
    <canvas id="minimap" width="180" height="180"></canvas>
    <div id="controls" class="panel">
      <b>Clic</b> : capturer la souris / frapper · <b>Clic droit</b> : parer<br>
      <b>ZQSD/WASD</b> : bouger · <b>Maj</b> : courir · <b>Molette</b> : zoom<br>
      <b>E</b> : ville · <b>1</b> suivez-moi · <b>2</b> chargez · <b>3</b> tenez la position<br>
      <b>Échap</b> : libérer la souris
    </div>
    <div id="crosshair">+</div>
  </div>

  <div id="town" class="panel hidden"></div>
  <div id="ko" class="hidden"><h1>K.O.</h1><p id="koText"></p></div>
  <div id="floats"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="game.js"></script>
</body>
</html>
